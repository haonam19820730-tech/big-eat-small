<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050816" />
  <title>大吃小</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --bg: #050816;
      --card: rgba(10, 14, 28, 0.9);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f3f6ff;
      --muted: #93a0b8;
      --mint: #3dff9a;
      --pink: #ff4f8b;
      --gold: #ffd166;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      touch-action: none;
      user-select: none;
      overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }
    .hidden { display: none !important; }
    input, button { font-family: inherit; }
    input { touch-action: manipulation; user-select: text; }

    #menu, #join, #dead {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      background: rgba(5, 8, 22, 0.55);
    }
    .card {
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 24px 20px 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0; text-align: center; font-size: 36px; letter-spacing: 3px; }
    .sub { text-align: center; color: var(--muted); margin: 6px 0 16px; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 16px;
      padding: 0 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: var(--mint); }
    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn.primary { background: var(--mint); color: #042214; }
    .btn.blue { background: #5b6cff; color: #fff; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .how {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .how b { color: var(--gold); }

    #hud {
      position: fixed;
      top: calc(10px + var(--safe-t));
      left: calc(10px + var(--safe-l));
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .pill, .board {
      background: rgba(6, 10, 22, 0.72);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }
    .pill b { color: var(--mint); }
    .board { min-width: 148px; }
    .board .row { display: flex; justify-content: space-between; gap: 12px; }
    .board .me { color: var(--mint); font-weight: 700; }
    #feed {
      position: fixed;
      top: calc(10px + var(--safe-t));
      right: calc(10px + var(--safe-r));
      z-index: 6;
      width: 160px;
      pointer-events: none;
      font-size: 12px;
      color: #d7deee;
      text-align: right;
    }
    #roomBar {
      position: fixed;
      left: 50%;
      top: calc(10px + var(--safe-t));
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      gap: 8px;
    }
    #roomBar button, #roomBar span {
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(8, 12, 22, 0.82);
      color: var(--text);
      padding: 0 10px;
      font-size: 12px;
    }
    #boost {
      position: fixed;
      right: calc(16px + var(--safe-r));
      bottom: calc(22px + var(--safe-b));
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 2px solid rgba(255, 209, 102, 0.7);
      background: rgba(255, 209, 102, 0.16);
      color: var(--gold);
      font-weight: 900;
      font-size: 16px;
      z-index: 6;
    }
    #boost.down, #boost:active { background: rgba(255, 209, 102, 0.45); transform: scale(0.96); }
    #tip {
      position: fixed;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      z-index: 6;
      pointer-events: none;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 10px #000;
      font-size: 18px;
      font-weight: 800;
      opacity: 0;
      transition: opacity .3s;
    }
    #tip.show { opacity: 1; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(130px + var(--safe-b));
      transform: translateX(-50%);
      background: rgba(8, 12, 22, 0.92);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    .stat { text-align: center; font-size: 34px; margin: 6px 0 2px; color: var(--mint); }
    .hint { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div class="pill">第 <b id="rank">-</b> 名　長度 <b id="score">0</b>　擊殺 <b id="kills">0</b></div>
    <div class="board" id="board"></div>
  </div>
  <div id="feed" class="hidden"></div>
  <div id="roomBar" class="hidden">
    <span id="roomCode">房間 ----</span>
    <button id="copyRoom" type="button">複製邀請</button>
  </div>
  <button id="boost" class="hidden" type="button">加速</button>
  <div id="tip">拖動轉向 · 大的吃小的</div>
  <div id="toast"></div>

  <div id="menu">
    <div class="card">
      <h1>大吃小</h1>
      <p class="sub">像貪食蛇，但大的可以吃小的<br/>越吃越長，越長越強</p>
      <label for="name">你的名字</label>
      <input id="name" maxlength="8" placeholder="玩家" autocomplete="off" />
      <button class="btn primary" id="btnSolo" type="button">開始遊戲</button>
      <button class="btn blue" id="btnHost" type="button">開房間多人玩</button>
      <button class="btn ghost" id="btnJoin" type="button">加入房間</button>
      <div class="how">
        <b>規則</b><br/>
        手指拖去哪，蛇頭就朝哪裡衝。<br/>
        吃亮點會變長。你比別人壯，撞到他就能吃掉。<br/>
        去撞比你大的，你會被吃。長按加速會變短一點。
      </div>
    </div>
  </div>

  <div id="join" class="hidden">
    <div class="card">
      <h1 style="font-size:26px">加入房間</h1>
      <p class="sub">輸入朋友的 4 碼房間號</p>
      <input id="joinCode" maxlength="4" placeholder="例如 7K2P" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:22px" />
      <button class="btn primary" id="btnJoinGo" type="button">進入遊戲</button>
      <button class="btn ghost" id="btnJoinBack" type="button">返回</button>
    </div>
  </div>

  <div id="dead" class="hidden">
    <div class="card">
      <h1 style="font-size:26px" id="deadTitle">被吃掉了</h1>
      <div class="stat" id="deadScore">0</div>
      <p class="hint" id="deadHint">本局最長</p>
      <button class="btn primary" id="btnAgain" type="button">再衝一次</button>
      <button class="btn ghost" id="btnHome" type="button">回選單</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
